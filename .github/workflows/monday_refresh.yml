name: Monday Execute + Dashboard Refresh

on:
  schedule:
    # 12:30 UTC Monday = 6:00 PM IST Monday (well after NSE close 3:30 PM IST)
    - cron: "30 12 * * 1"
    # Fallback: 12:30 UTC Tuesday, in case Monday was an NSE holiday.
    # Re-running is idempotent (full history is recomputed from price data +
    # rules each time), so this just naturally picks up Tuesday's close if
    # Monday had no trading data.
    - cron: "30 12 * * 2"
  workflow_dispatch: {}


permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full simulation + rebuild dashboard
        run: python scripts/run.py

      - name: Commit updated data + dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "Monday refresh: rebalance + dashboard update $(date -u +%Y-%m-%d)"
          git push

  deploy-pages:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
