name: Robustness Sweep (Lookback Stability + Walk-Forward)

on:
  workflow_dispatch: {}
  schedule:
    # Monthly, 1st of the month, 07:00 UTC = 12:30 PM IST -- this is
    # expensive (16 lookbacks x 2 methods, twice over, plus bootstrap /
    # shuffle resampling) so it does NOT run on the weekly Saturday/Monday
    # schedule.
    - cron: "0 7 1 * *"

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run robustness / curve-fit-avoidance suite
        env:
          DATA_SOURCE: ${{ vars.DATA_SOURCE || 'yfinance' }}
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
          STOP_LOSS_ENABLED: ${{ vars.STOP_LOSS_ENABLED || 'true' }}
          STOP_LOSS_PCT: ${{ vars.STOP_LOSS_PCT || '10.0' }}
          PARABOLIC_FILTER_ENABLED: ${{ vars.PARABOLIC_FILTER_ENABLED || 'false' }}
          PARABOLIC_ZSCORE_THRESHOLD: ${{ vars.PARABOLIC_ZSCORE_THRESHOLD || '2.5' }}
          PARABOLIC_ZSCORE_WINDOW: ${{ vars.PARABOLIC_ZSCORE_WINDOW || '252' }}
          WALK_FORWARD_SELECTION_METRIC: ${{ vars.WALK_FORWARD_SELECTION_METRIC || 'calmar' }}
          WALK_FORWARD_DD_PENALTY_WEIGHT: ${{ vars.WALK_FORWARD_DD_PENALTY_WEIGHT || '1.0' }}
          WALK_FORWARD_REPORT_LOOKBACKS: ${{ vars.WALK_FORWARD_REPORT_LOOKBACKS || '50,75,100,120,140,160,180,200' }}
          LOOKBACK_SWEEP_MIN: ${{ vars.LOOKBACK_SWEEP_MIN || '15' }}
          LOOKBACK_SWEEP_MAX: ${{ vars.LOOKBACK_SWEEP_MAX || '401' }}
          LOOKBACK_SWEEP_STEP: ${{ vars.LOOKBACK_SWEEP_STEP || '5' }}
        run: python scripts/run_robustness.py

      - name: Rebuild dashboard (to pick up new robustness.json)
        env:
          DATA_SOURCE: ${{ vars.DATA_SOURCE || 'yfinance' }}
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
          STOP_LOSS_ENABLED: ${{ vars.STOP_LOSS_ENABLED || 'true' }}
          STOP_LOSS_PCT: ${{ vars.STOP_LOSS_PCT || '10.0' }}
          PARABOLIC_FILTER_ENABLED: ${{ vars.PARABOLIC_FILTER_ENABLED || 'false' }}
          PARABOLIC_ZSCORE_THRESHOLD: ${{ vars.PARABOLIC_ZSCORE_THRESHOLD || '2.5' }}
          PARABOLIC_ZSCORE_WINDOW: ${{ vars.PARABOLIC_ZSCORE_WINDOW || '252' }}
        run: python scripts/run.py

      - name: Commit updated data + dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "Robustness sweep refresh $(date -u +%Y-%m-%d)"
          git push

  deploy-pages:
    needs: sweep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
